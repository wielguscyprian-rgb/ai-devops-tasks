jenkins:
  systemMessage: "Instancja Jenkins skonfigurowana automatycznie za pomocą Jenkins Configuration as Code (JCasC)"
  numExecutors: 4
  scmRetryCount: 3
  mode: NORMAL

unclassified:
  buildTimeoutWrapper:
    defaultTimeoutMinutes: 60
    failBuild: true

tool:
  maven:
    installations:
      - name: "Maven 3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.6"
  nodejs:
    installations:
      - name: "NodeJS 20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.11.1"
  dockerTool:
    installations:
      - name: "Docker"
        properties:
          - installSource:
              installers:
                - dockerInstaller:
                    id: "latest"

jobs:
  - script: |
      pipelineJob('sample-web-app-pipeline') {
        description('Przykładowy potok CI/CD utworzony automatycznie przy użyciu Job DSL')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/example/sample-web-app.git')
                }
                branches('main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }